# YOLO11s + CBAM (Convolutional Block Attention Module)
# Modified for CARR dataset — overhead 45-90° retail surveillance
#
# Real channel sizes verified from yolo11s.pt (width_multiple=0.5):
#   Layer 4  (C3k2 P3): out=128ch
#   Layer 6  (C3k2 P4): out=256ch
#   Layer 10 (C2PSA P5): out=512ch
#   Layer 13 (C3k2 neck): out=256ch
#   Layer 16 (C3k2 neck): out=128ch
#   Layer 19 (C3k2 neck): out=256ch
#   Layer 22 (C3k2 neck): out=512ch

nc: 6
scales:
  s: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]           # 0-P1/2    out=32
  - [-1, 1, Conv, [128, 3, 2]]          # 1-P2/4    out=64
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2         out=128 (after scale)
  - [-1, 1, Conv, [256, 3, 2]]          # 3-P3/8    out=128
  - [-1, 2, C3k2, [512, False, 0.25]]   # 4         out=128 → P3 ref
  - [-1, 1, Conv, [512, 3, 2]]          # 5-P4/16   out=256
  - [-1, 2, C3k2, [512, True]]          # 6         out=256 → P4 ref
  - [-1, 1, Conv, [1024, 3, 2]]         # 7-P5/32   out=512
  - [-1, 2, C3k2, [1024, True]]         # 8         out=512
  - [-1, 1, SPPF, [1024, 5]]            # 9         out=256
  - [-1, 2, C2PSA, [1024]]              # 10        out=512 → P5 ref

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11  512ch
  - [[-1, 6], 1, Concat, [1]]                   # 12  512+256=768ch
  - [-1, 2, C3k2, [512, False]]                 # 13  out=256ch
  - [-1, 1, CBAM, [256]]                        # 14  CBAM 256ch ← P4 attention

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 15  256ch
  - [[-1, 4], 1, Concat, [1]]                   # 16  256+128=384ch
  - [-1, 2, C3k2, [256, False]]                 # 17  out=128ch
  - [-1, 1, CBAM, [128]]                        # 18  CBAM 128ch ← P3 small attention

  - [-1, 1, Conv, [256, 3, 2]]                  # 19  128→128ch
  - [[-1, 13], 1, Concat, [1]]                  # 20  128+256=384ch
  - [-1, 2, C3k2, [512, False]]                 # 21  out=256ch
  - [-1, 1, CBAM, [256]]                        # 22  CBAM 256ch ← P4 medium

  - [-1, 1, Conv, [512, 3, 2]]                  # 23  256→256ch
  - [[-1, 10], 1, Concat, [1]]                  # 24  256+512=768ch
  - [-1, 2, C3k2, [1024, True]]                 # 25  out=512ch
  - [-1, 1, CBAM, [512]]                        # 26  CBAM 512ch ← P5 large

  - [[18, 22, 26], 1, Detect, [nc]]             # 27  Detect(P3, P4, P5)
